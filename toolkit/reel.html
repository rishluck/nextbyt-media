<html><head><style>
@font-face{font-family:'Cormorant';src:url(cormorant-garamond-latin-500-italic.woff2);font-style:italic;font-weight:500}
@font-face{font-family:'Josefin';src:url(josefin-sans-latin-300-normal.woff2);font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0d0a09;color:#f5f0ea;font-family:'DM Sans';overflow:hidden;position:relative}
#glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(207,100,41,.28),rgba(207,100,41,0) 62%);left:-160px;top:260px}
.scene{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;opacity:0}
.line{overflow:hidden;padding:6px 0}
.line>span{display:inline-block;font-weight:500;font-size:150px;line-height:1.05;letter-spacing:-5px}
em{font-family:'Cormorant';font-style:italic;font-weight:500;color:#d4a070;font-size:1.12em;letter-spacing:-2px}
.tag{font-family:'Josefin';font-weight:300;letter-spacing:10px;font-size:34px;color:#f0a46e;text-transform:uppercase;margin-bottom:30px}
#s4{align-items:center;text-align:center}
.word{font-family:'Josefin';font-weight:300;letter-spacing:14px;font-size:64px;color:#fff;margin-top:50px}
.word span{color:#d4a070}
.url{margin-top:70px;background:linear-gradient(#ee8a4c,#cf6429);color:#0d0a09;border-radius:999px;padding:26px 60px;font-size:48px;font-weight:500;box-shadow:0 20px 60px rgba(207,100,41,.4)}
.sub{margin-top:40px;font-size:36px;font-weight:300;color:#9a8a82}
</style></head><body><div id="glow"></div>
<div class="scene" id="s1"><div class="tag">Small business?</div><div class="line"><span>Look</span></div><div class="line"><span><em>bigger</em> online.</span></div></div>
<div class="scene" id="s2"><div class="line"><span>Websites.</span></div><div class="line"><span>Shopify.</span></div><div class="line"><span><em>Brands.</em></span></div></div>
<div class="scene" id="s3"><div class="line"><span>Built to</span></div><div class="line"><span>look good.</span></div><div class="line"><span><em>Made to sell.</em></span></div></div>
<div class="scene" id="s4"><div id="mk"><svg viewBox="0 0 100 100" width="200" height="200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#eacca8"/><stop offset="50%" stop-color="#d4a070"/><stop offset="100%" stop-color="#a86030"/></linearGradient></defs><path d="M4 22 L4 4 L22 4" fill="none" stroke="url(#g)" stroke-width="2.2"/><path d="M78 4 L96 4 L96 22" fill="none" stroke="url(#g)" stroke-width="2.2"/><path d="M4 78 L4 96 L22 96" fill="none" stroke="url(#g)" stroke-width="2.2"/><path d="M78 96 L96 96 L96 78" fill="none" stroke="url(#g)" stroke-width="2.2"/><line x1="27" y1="21" x2="27" y2="79" stroke="url(#g)" stroke-width="10"/><line x1="73" y1="21" x2="73" y2="79" stroke="url(#g)" stroke-width="10"/><line x1="27" y1="21" x2="73" y2="79" stroke="url(#g)" stroke-width="10"/><rect x="42" y="42" width="12" height="12" fill="#0d0a09"/></svg></div><div class="word">NEXT<span>BYT</span></div><div class="url">nextbyt.uk</div><div class="sub">Digital studio, Nottingham</div></div>
<script>
const cl=x=>Math.max(0,Math.min(1,x));
const oc=x=>1-Math.pow(1-x,3), ic=x=>x*x*x;
const ob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const S=[['s1',0.0,2.6],['s2',2.6,5.2],['s3',5.2,8.4],['s4',8.4,99]];
window.renderFrame=function(t){
 document.getElementById('glow').style.transform=`translate(${Math.sin(t*.5)*80}px,${Math.cos(t*.4)*120}px)`;
 for(const [id,a,b] of S){
  const el=document.getElementById(id);
  const vis=t>=a-0.01&&t<b; el.style.opacity=vis?1:0; if(!vis) continue;
  const out=cl((t-(b-0.35))/0.35);
  const items=[...el.children];
  items.forEach((c,i)=>{
    const p=oc(cl((t-a-0.12-i*0.18)/0.5));
    const tgt=c.classList.contains('line')?c.firstElementChild:c;
    if(id==='s4'){
      const q=i==0?ob(cl((t-a)/0.6)):oc(cl((t-a-0.3-i*0.2)/0.5));
      tgt.style.transform=i==0?`scale(${0.4+0.6*q}) rotate(${(1-q)*-20}deg)`:`translateY(${(1-q)*60}px)`;
      tgt.style.opacity=cl(q*1.2);
    } else {
      tgt.style.transform=`translateY(${(1-p)*110 - ic(out)*-0}%)`;
      tgt.style.opacity=(1-out);
    }
  });
 }
};
</script></body></html>
